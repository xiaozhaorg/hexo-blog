# Hexo Configuration
## Docs: https://hexo.io/docs/configuration

# Site
title: 小吒博客
subtitle: ''
description: '小吒的个人博客'
keywords:
author: 小吒
language: zh-CN
timezone: 'Asia/Shanghai'

# URL
url: https://blog.fx123.cc
root: /
permalink: posts/:abbrlink.html
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  enable: false
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss

# Pagination
per_page: 10
pagination_dir: page

# Extensions
theme: anzhiyu

# abbrlink config
abbrlink:
  alg: crc32      # crc16/crc32, 短链接算法
  rep: hex        # hex/dec, 输出格式（hex=16进制, dec=10进制）
  drafts: false   # 是否为草稿生成abbrlink
  auto_category: false
  auto_title: false
  auto_date: false
  auto_tags: false

# Deployment
deploy:
  type: ''
